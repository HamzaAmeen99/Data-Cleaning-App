{% extends "base.html" %}
{% block title %}Error — DataClean{% endblock %}

{% block content %}
<div style="max-width:480px;margin:80px auto;text-align:center;">
  <div style="width:56px;height:56px;border-radius:var(--radius-xl);background:var(--error-soft);color:var(--error);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
    <span class="material-symbols-outlined" style="font-size:28px;">error</span>
  </div>

  <h1 style="font-size:22px;font-weight:700;margin:0 0 8px;">Something went wrong</h1>
  <p class="text-sm text-secondary" style="margin:0 0 24px;">
    {{ message or "An unexpected issue occurred while processing your dataset." }}
  </p>

  <div class="flex items-center justify-center gap-3">
    <a href="{{ url_for('upload.upload_page') }}" class="btn btn-primary">
      Back to Upload
    </a>
  </div>
</div>
{% endblock %}
